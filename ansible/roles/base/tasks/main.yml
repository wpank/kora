---
- name: Update pacman cache
  community.general.pacman:
    update_cache: true

- name: Install base packages
  community.general.pacman:
    name:
      - base-devel
      - git
      - rsync
      - curl
      - jq
      - htop
      - python
      - nftables
    state: present

- name: Set timezone to UTC
  community.general.timezone:
    name: UTC

- name: Enable and start systemd-timesyncd (NTP)
  ansible.builtin.systemd:
    name: systemd-timesyncd
    enabled: true
    state: started

- name: Ensure Docker group exists before assigning kora user
  ansible.builtin.group:
    name: docker
    state: present
    system: true

- name: Create kora service group
  ansible.builtin.group:
    name: "{{ kora_user }}"
    state: present

- name: Create kora service user
  ansible.builtin.user:
    name: "{{ kora_user }}"
    group: "{{ kora_user }}"
    groups: docker
    append: true
    shell: /bin/bash
    home: "/home/{{ kora_user }}"
    create_home: true
    state: present

- name: Create project directory
  ansible.builtin.file:
    path: "{{ remote_project_dir }}"
    state: directory
    owner: "{{ kora_user }}"
    group: "{{ kora_user }}"
    mode: "0755"
